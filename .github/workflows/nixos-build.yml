name: NixOS Build Test

on:
  push:
    branches: [ nixos-port ]
  pull_request:
    branches: [ nixos-port ]

jobs:
  build-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installa un Nix MODERNO. A differenza di `curl | sh` in una shell
      # usa-e-getta, questa action esporta nix nel PATH per TUTTI i passi
      # successivi. Prima era questo il punto debole: veniva invocato un nix
      # vecchio/sbagliato -> "unrecognised flag --print-out-link" e gli errori
      # di fetchTarball.
      - name: Install Nix (modern, exported to PATH for all steps)
        uses: DeterminateSystems/nix-installer-action@v1
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      - name: Nix version
        run: nix --version

      # Check rapido (fail-fast): il flake è valido e la feature 'flakes' è
      # attiva. Se FALLISCE QUI, il problema è di setup CI, NON della config.
      - name: Validate flake
        run: nix flake metadata .

      # Build dell'intera closure NixOS (tutti i pacchetti del sistema).
      # `.config.system.build.toplevel` è la singola derivation che trascina
      # con sé ogni pacchetto = "la closure completa". Usa cache.nixos.org
      # (binari precompilati) per finire in tempo ragionevole.
      - name: Build full closure (nixpkgs 24.11 pinned via flake input)
        run: |
          set -euo pipefail
          # --no-link: no result symlink in CWD; --print-out-paths: prints the
          # store path(s) of the built output to stdout. (There is NO
          # --print-out-link flag on `nix build` — that was the CI bug.)
          out=$(nix build --no-link --print-out-paths .#nixosConfigurations.mardock.config.system.build.toplevel)
          echo "Toplevel built at: $out"
