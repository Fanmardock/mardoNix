name: NixOS Build Test

on:
  push:
    branches: [ nixos-port ]
  pull_request:
    branches: [ nixos-port ]

jobs:
  build-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix (single-user)
        run: |
          curl -L https://nixos.org/nix/install | sh
          mkdir -p $HOME/.config/nix
          echo "experimental-features = nix-command flakes" > $HOME/.config/nix/nix.conf
          source $HOME/.nix-profile/etc/profile.d/nix.sh
          nix --version

      - name: Validate configuration.nix syntax
        run: |
          source $HOME/.nix-profile/etc/profile.d/nix.sh
          nix-instantiate --parse nixos/configuration.nix > /dev/null && echo "Syntax OK"

      # nixpkgs 24.11 è pinnato ermeticamente dentro nixos/default.nix
      # (fetchTarball): nessun canale/NIX_PATH/NIXPKGS_URL da gestire qui,
      # e nessun experimental feature richiesto (non è un flake reference).
      - name: Build full closure (nixpkgs 24.11 pinned, hermetic)
        run: |
          source $HOME/.nix-profile/etc/profile.d/nix.sh
          nix build --impure -f nixos/default.nix
