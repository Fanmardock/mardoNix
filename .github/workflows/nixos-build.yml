name: NixOS Build Test

on:
  push:
    branches: [ nixos-port ]
  pull_request:
    branches: [ nixos-port ]

jobs:
  build-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix (single-user)
        run: |
          curl -L https://nixos.org/nix/install | sh
          mkdir -p $HOME/.config/nix
          echo "experimental-features = nix-command flakes" > $HOME/.config/nix/nix.conf
          source $HOME/.nix-profile/etc/profile.d/nix.sh
          nix --version

      # Build della NOSTRA configuration.nix contro nixpkgs 24.11 STABILE.
      # Il pin è ermetico: flake.nix dichiara l'input `nixpkgs` sulla branch
      # di release nixos-24.11 (non master/unstable) e la locka nel /nix/store.
      # `.system` == nixosConfigurations.mardock.config.system.build.toplevel,
      # cioè la toplevel = l'intera closure (tutti i pacchetti compilati).
      - name: Build full closure (nixpkgs 24.11 pinned via flake input)
        run: |
          source $HOME/.nix-profile/etc/profile.d/nix.sh
          nix build --print-out-link .#nixosConfigurations.mardock.system
