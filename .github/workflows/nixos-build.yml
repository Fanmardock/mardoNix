name: NixOS Build Test

on:
  push:
    branches: [ nixos-port ]
  pull_request:
    branches: [ nixos-port ]

jobs:
  build-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix (single-user)
        run: |
          curl -L https://nixos.org/nix/install | sh
          mkdir -p $HOME/.config/nix
          echo "experimental-features = nix-command flakes" > $HOME/.config/nix/nix.conf
          source $HOME/.nix-profile/etc/profile.d/nix.sh
          nix --version

      - name: Validate configuration.nix syntax
        run: |
          source $HOME/.nix-profile/etc/profile.d/nix.sh
          nix-instantiate --parse nixos/configuration.nix > /dev/null && echo "Syntax OK"

      # Pinning esplicito a nixpkgs 24.11 stabile (NixOS/nixpkgs@nixos-24.11),
      # build della NOSTRA configuration.nix via entry point default.nix,
      # experimental features passate anche da CLI per non dipendere da nix.conf.
      - name: Build full closure (nixpkgs 24.11 pinned, our configuration)
        run: |
          source $HOME/.nix-profile/etc/profile.d/nix.sh
          export NIXPKGS_URL="github:NixOS/nixpkgs?rev=nixos-24.11"
          # NB: ogni feature come argomento SEPARATO (una stringa con spazio
          # verrebbe letta come un solo nome di feature -> errore immediato).
          nix --extra-experimental-features nix-command \
              --extra-experimental-features flakes \
              build --impure -f nixos/default.nix
